[project]
name = "vid2note"
version = "0.4.5"
description = "把 B 站视频变成带时间戳的 Markdown 笔记。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vid2note contributors" }]
keywords = ["bilibili", "markdown", "notes", "transcript", "obsidian", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "qrcode>=7.4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
cloud = ["av>=11,<14", "yt-dlp>=2025.1"]
vosk = ["vosk>=0.3.45", "av>=11,<14", "yt-dlp>=2025.1"]
whisper = ["faster-whisper>=1.0", "av>=11,<14", "yt-dlp>=2025.1"]
scene = ["av>=11,<14", "yt-dlp>=2025.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
vid2note = "vid2note.cli:app"
vidnote = "vid2note.cli:app"

[project.urls]
Homepage = "https://github.com/paper-k1te/vid2note"
Repository = "https://github.com/paper-k1te/vid2note"
Issues = "https://github.com/paper-k1te/vid2note/issues"
Changelog = "https://github.com/paper-k1te/vid2note/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vid2note", "src/vidnote"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/research",
  "/.venv",
  "/dist*",
  "/build*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/vid2note/cli.py" = ["B008"]
"src/vidnote/cli.py" = ["B008"]
"src/vid2note/gui.py" = ["E501"]
"src/vidnote/gui.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
