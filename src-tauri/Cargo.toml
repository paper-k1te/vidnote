[package]
name = "vidnote-desktop"
version = "0.3.4"
description = "vidnote - B站视频带时间戳笔记桌面端"
authors = ["Paperkite Studio", "vidnote contributors"]
edition = "2021"

[lib]
name = "vidnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
open = "5"
rfd = "0.15"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
