[project]
name = "mpflow"
version = "0.1.0"
description = "Markdown to WeChat Official Account drafts, from the terminal. CLI + MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "mpflow contributors" }]
keywords = ["wechat", "markdown", "mcp", "publishing", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "markdown-it-py>=3.0",
  "rich>=13.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
mpflow = "mpflow.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpflow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
